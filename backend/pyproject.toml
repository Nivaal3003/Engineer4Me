[project]
name = "engineer4me-backend"
version = "0.1.0"
description = "Backend API for Engineer4Me"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "defusedxml>=0.7.1,<1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pypdfium2>=5.3.0,<6.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "xlrd>=2.0.1,<3.0.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
