[project]
name = "engineer4me-backend"
version = "0.1.0"
description = "Backend API for Engineer4Me"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]